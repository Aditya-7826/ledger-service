# Serves the built dashboard and forwards API calls, so the browser sees one origin.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Live notifications (Server-Sent Events): no buffering, long read timeout.
    location /v1/stream/ {
        proxy_pass http://consumer-notify:9100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location /v1/views/ {
        proxy_pass http://consumer-balances:9100;
    }
    location /v1/ {
        proxy_pass http://api:8080;
    }
    # Load-test result files, mounted from ./results.
    location /results/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
