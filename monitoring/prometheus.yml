# Used only by the optional "monitoring" Compose profile.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: outbox-relay
    static_configs:
      - targets: ["outbox-relay:9100"]
  - job_name: consumer-balances
    static_configs:
      - targets: ["consumer-balances:9100"]
  - job_name: consumer-notify
    static_configs:
      - targets: ["consumer-notify:9100"]
