# Sized for an 8 GB laptop: Postgres 512 MB, Redpanda 1 GB.
# Ports are bound to localhost only.
name: ledger-service

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: ledger-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      # Redpanda refuses to start if --memory is not below the container limit
      # ("insufficient physical memory"), so it gets 900M inside the 1 GB cap.
      - --memory=900M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda:/var/lib/redpanda/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        SERVICE: api
    image: ledger-service/api
    container_name: ledger-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      API_PORT: "8080"
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      MAX_TRANSFER_MINOR: ${MAX_TRANSFER_MINOR:-100000000000}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Keep the Go heap comfortably inside the 256 MB container limit.
      GOMEMLIMIT: 200MiB
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s
    restart: unless-stopped

  outbox-relay:
    build:
      context: .
      args:
        SERVICE: outbox-relay
    image: ledger-service/outbox-relay
    container_name: ledger-outbox-relay
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      METRICS_PORT: "9100"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOMEMLIMIT: 200MiB
    ports:
      - "127.0.0.1:9101:9100"   # /metrics and /healthz
    depends_on:
      api:
        condition: service_healthy   # the API applies the migrations
      redpanda:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  consumer-balances:
    build:
      context: .
      args:
        SERVICE: consumer-balances
    image: ledger-service/consumer-balances
    container_name: ledger-consumer-balances
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      LEDGER_API_URL: http://api:8080
      GAP_TIMEOUT_SECONDS: ${GAP_TIMEOUT_SECONDS:-10}
      METRICS_PORT: "9100"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOMEMLIMIT: 200MiB
    ports:
      - "127.0.0.1:8081:9100"   # /v1/views/balances/{id}, /metrics, /healthz
    depends_on:
      api:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  consumer-notify:
    build:
      context: .
      args:
        SERVICE: consumer-notify
    image: ledger-service/consumer-notify
    container_name: ledger-consumer-notify
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      METRICS_PORT: "9100"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOMEMLIMIT: 200MiB
    ports:
      - "127.0.0.1:8082:9100"   # /v1/stream/events (SSE), /metrics, /healthz
    depends_on:
      api:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: ledger-service/web
    container_name: ledger-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    volumes:
      - ./results:/usr/share/nginx/html/results:ro   # load-test result files shown on the System page
    depends_on:
      api:
        condition: service_healthy
      consumer-balances:
        condition: service_healthy
      consumer-notify:
        condition: service_healthy
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---- optional monitoring: docker compose --profile monitoring up -d ----
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    container_name: ledger-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 256m

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:11.3.0
    container_name: ledger-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    mem_limit: 256m

volumes:
  pgdata:
  redpanda:
