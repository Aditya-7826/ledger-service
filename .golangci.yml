version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
  settings:
    errcheck:
      # Closing a response body, file or pool and removing a temp folder are
      # best-effort cleanup: there is nothing useful to do if they fail.
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - os.RemoveAll
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests may ignore errors from cleanup and best-effort reads.
      - path: _test\.go
        linters: [errcheck, bodyclose]
